format_version = 7
id = "omega.debug.zone-clear"
version = "1.0.0"
name = "Clear Zones Instantly (testing)"
author = "Omega Thrust"
description = "Ends zones that use the game's shared wave timeline as cleared as soon as you are in play, for scripted tests."
resolver = "declarative"
save_compatibility = "shared"

# The plugin hooks this EXE's zone timeline runner, and the build is compiled
# for this EXE alone.
[[target]]
game_id = "SCUS-94449"

# Hidden: scripted runs enable it in mods/state.toml.
[[feature]]
id = "zone-clear"
name = "Clear Zones Instantly (testing)"
description = "For testing. While on, a zone that uses the game's shared wave timeline ends as cleared as soon as you are in play; checked in the 1ST to 4TH ZONE of CAMPAIGN PLAY. With nothing destroyed the results give a low grade (B in the 1ST ZONE, D in the 2ND to 4TH), and with the option below they give S. Results and records made this way are not genuine."
group = "Debug"
default_enabled = false
hidden = true

[[option]]
feature = "zone-clear"
id = "all-destroyed"
label = "Count every enemy as destroyed"
description = "Waits until an enemy has appeared, then counts every enemy so far as destroyed before the clear, so the results rate the zone S."
type = "boolean"
default = "false"

[[plugin]]
feature = "zone-clear"
id = "omega.zone-clear"
