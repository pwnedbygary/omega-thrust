format_version = 7
id = "omega.gameplay.branching"
version = "1.0.0"
name = "Branching Campaign (prototype)"
author = "Omega Thrust"
description = "Lets your grade in the 1ST ZONE change the order of the campaign's early zones."
resolver = "declarative"
save_compatibility = "shared"

# The plugin hooks this EXE's campaign loop, and the build is compiled for
# this EXE alone.
[[target]]
game_id = "SCUS-94449"

[[feature]]
id = "branching"
name = "Branching Campaign (prototype)"
description = "Disabled by default. While on, an S grade in the 1ST ZONE of CAMPAIGN PLAY sends you straight to the 3RD ZONE. The campaign then returns to the 2ND ZONE and the movie after it, and goes on to the 4TH ZONE. Any other grade keeps the usual order. Either way you play every zone once."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "branching"
id = "omega.branching"
