# Omega Thrust's keyboard and mouse layout, made for the Mouse Aim mod
# (mods/preloaded/packages/omega.enhancement.mouse-aim). The runtime reads
# keybinds.ini from the executable's directory: copy this file there under
# that name, or set the same keys on the launcher's Controls page.
#
#   Mouse          steer (the left stick; Mouse Aim)
#   Left button    hold while the game locks on, release to launch the
#                  homing lasers (Mouse Aim)
#   Right button   hold to keep firing the laser rifle (Mouse Aim)
#   W A S D        up, left, down, right: the left stick's keys, and the
#                  d-pad's in menus (the arrow keys too); with Mouse Aim
#                  they strafe in flight, without it they steer
#   Left Shift     boost (Triangle)
#   Space          boost (Circle)
#   Left Ctrl      stop, or thrust with CONTROL B (R1)
#   Q              scan: hold to keep facing the enemy (L1)
#   E              viper boost (L2)
#   C, middle      back view (R2)
#   F              quick turn: a 180 with the stick pushed (L3); with Mouse
#                  Aim the mouse moves the stick
#   V              view change (Select)
#   Return         pause, and start in menus (Start)
#   X, Z           ATTACK once (Cross, Square)
#
# In menus X and Space confirm (Cross, Circle), and Z and Left Shift go back
# (Square, Triangle). The left and right mouse buttons are bound to nothing
# here: in flight Mouse Aim turns them into ATTACK presses.

[player1]
up        = W, Up
down      = S, Down
left      = A, Left
right     = D, Right
triangle  = Left Shift
circle    = Space
cross     = X
square    = Z
l1        = Q
l2        = E
r1        = Left Ctrl
r2        = C, Mouse2
l3        = F
r3        = None
start     = Return
select    = V
ls_up     = W, Up
ls_down   = S, Down
ls_left   = A, Left
ls_right  = D, Right
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None
